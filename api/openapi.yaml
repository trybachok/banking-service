openapi: 3.0.3

info:
  title: Banking Service API
  version: 1.0.0
  description: REST API банковского сервиса на Go.

servers:
  - url: http://localhost:8085
    description: Local Docker environment

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is alive

  /ready:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service is ready

  /register:
    post:
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /login:
    post:
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      summary: Current authenticated user
      responses:
        "200":
          description: Current user identity
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts:
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

    get:
      summary: List current user accounts
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"

  /accounts/{accountId}/deposit:
    post:
      summary: Deposit money to account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyOperationRequest"
      responses:
        "200":
          description: Deposit completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOperationResponse"

  /accounts/{accountId}/withdraw:
    post:
      summary: Withdraw money from account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyOperationRequest"
      responses:
        "200":
          description: Withdrawal completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOperationResponse"

  /accounts/{accountId}/predict:
    get:
      summary: Predict account balance
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Balance prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancePredictionResponse"

  /transfer:
    post:
      summary: Transfer money between accounts
      parameters:
        - $ref: "#/components/parameters/MFAChallengeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cards:
    post:
      summary: Issue virtual card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCardRequest"
      responses:
        "201":
          description: Card issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailsResponse"

    get:
      summary: List user cards
      responses:
        "200":
          description: Card list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"

  /cards/{cardId}:
    get:
      summary: Get card details
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailsResponse"

  /cards/{cardId}/pay:
    post:
      summary: Pay by card
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/MFAChallengeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPaymentRequest"
      responses:
        "200":
          description: Card payment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPaymentResponse"

  /credits:
    post:
      summary: Issue credit
      parameters:
        - $ref: "#/components/parameters/MFAChallengeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCreditRequest"
      responses:
        "201":
          description: Credit issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueCreditResponse"

    get:
      summary: List credits
      responses:
        "200":
          description: Credit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditListResponse"

  /credits/{creditId}/schedule:
    get:
      summary: Get credit payment schedule
      parameters:
        - $ref: "#/components/parameters/CreditId"
      responses:
        "200":
          description: Credit schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentScheduleListResponse"

  /analytics:
    get:
      summary: Get financial analytics
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"

  /mfa/challenges:
    post:
      summary: Create MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMFAChallengeRequest"
      responses:
        "201":
          description: MFA challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAChallengeResponse"

  /mfa/challenges/{challengeId}/verify:
    post:
      summary: Verify MFA challenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyMFAChallengeRequest"
      responses:
        "200":
          description: MFA challenge verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAChallengeResponse"

  /admin/users:
    get:
      summary: Admin list users
      responses:
        "200":
          description: User list

  /admin/accounts/{accountId}/block:
    post:
      summary: Admin block account
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/MFAChallengeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockAccountRequest"
      responses:
        "200":
          description: Account blocked

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CreditId:
      name: creditId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MFAChallengeHeader:
      name: X-MFA-Challenge-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: integer
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - customer
            - admin
        status:
          type: string
          enum:
            - active
            - blocked
            - deleted

    CreateAccountRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
            - current
            - credit_repayment

    MoneyOperationRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: string
          example: "1000.00"
        description:
          type: string
        idempotencyKey:
          type: string

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        accountNo:
          type: string
        accountType:
          type: string
        currency:
          type: string
          enum:
            - RUB
        balance:
          type: string
        status:
          type: string
        blockedReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountResponse"

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        creditId:
          type: string
          format: uuid
        operationType:
          type: string
        status:
          type: string
        amount:
          type: string
        currency:
          type: string
        createdAt:
          type: string
          format: date-time

    AccountOperationResponse:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountResponse"
        transaction:
          $ref: "#/components/schemas/TransactionResponse"

    TransferRequest:
      type: object
      required:
        - sourceAccountId
        - destinationAccountId
        - amount
      properties:
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amount:
          type: string
        description:
          type: string
        idempotencyKey:
          type: string

    TransferResponse:
      type: object
      properties:
        sourceAccount:
          $ref: "#/components/schemas/AccountResponse"
        destinationAccount:
          $ref: "#/components/schemas/AccountResponse"
        transaction:
          $ref: "#/components/schemas/TransactionResponse"

    IssueCardRequest:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          format: uuid
        alias:
          type: string

    CardPaymentRequest:
      type: object
      required:
        - amount
        - cvv
      properties:
        amount:
          type: string
        cvv:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: string
        idempotencyKey:
          type: string

    CardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        alias:
          type: string
        panMasked:
          type: string
        panLast4:
          type: string
        status:
          type: string

    CardDetailsResponse:
      type: object
      properties:
        card:
          $ref: "#/components/schemas/CardResponse"
        pan:
          type: string
        expiry:
          type: string
        cvv:
          type: string
        notice:
          type: string

    CardListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CardResponse"

    CardPaymentResponse:
      type: object
      properties:
        card:
          $ref: "#/components/schemas/CardResponse"
        account:
          $ref: "#/components/schemas/AccountResponse"
        transaction:
          $ref: "#/components/schemas/TransactionResponse"

    IssueCreditRequest:
      type: object
      required:
        - disbursementAccountId
        - repaymentAccountId
        - principalAmount
        - termMonths
      properties:
        disbursementAccountId:
          type: string
          format: uuid
        repaymentAccountId:
          type: string
          format: uuid
        principalAmount:
          type: string
        termMonths:
          type: integer
          minimum: 1
        bankMargin:
          type: string

    CreditResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        principalAmount:
          type: string
        outstandingPrincipal:
          type: string
        annualInterestRate:
          type: string
        cbrKeyRate:
          type: string
        termMonths:
          type: integer
        annuityPayment:
          type: string
        status:
          type: string

    PaymentScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creditId:
          type: string
          format: uuid
        installmentNo:
          type: integer
        dueDate:
          type: string
          format: date-time
        totalAmount:
          type: string
        paidAmount:
          type: string
        status:
          type: string

    IssueCreditResponse:
      type: object
      properties:
        credit:
          $ref: "#/components/schemas/CreditResponse"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/PaymentScheduleResponse"

    CreditListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreditResponse"

    PaymentScheduleListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentScheduleResponse"

    AnalyticsResponse:
      type: object
      properties:
        monthly:
          type: object
        creditLoad:
          type: object

    BalancePredictionResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        days:
          type: integer
        currentBalance:
          type: string
        predictedBalance:
          type: string
        plannedPayments:
          type: string
        items:
          type: array
          items:
            type: object

    CreateMFAChallengeRequest:
      type: object
      required:
        - purpose
      properties:
        purpose:
          type: string
          enum:
            - transfer
            - card_payment
            - credit_issue
            - account_block
        context:
          type: object
          additionalProperties: true

    VerifyMFAChallengeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6

    MFAChallengeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time

    BlockAccountRequest:
      type: object
      properties:
        reason:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
