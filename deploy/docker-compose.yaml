services:
  postgres:
    image: postgres:17-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking_service
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
    ports:
      - "5432:5432"
    volumes:
      - banking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: banking-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_CMD: migrate
    container_name: banking-migrator
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgres://banking_user:banking_password@postgres:5432/banking_service?sslmode=disable
      LOG_LEVEL: debug
    volumes:
      - ../migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_CMD: api
    container_name: banking-api
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgres://banking_user:banking_password@postgres:5432/banking_service?sslmode=disable
      APP_PORT: 8080
      LOG_LEVEL: debug
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@banking.local
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_CMD: scheduler
    container_name: banking-scheduler
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgres://banking_user:banking_password@postgres:5432/banking_service?sslmode=disable
      LOG_LEVEL: debug
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@banking.local
      SCHEDULER_INTERVAL_HOURS: 12
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  banking_postgres_data:
