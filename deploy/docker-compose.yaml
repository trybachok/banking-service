version: "3.9"
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    working_dir: /app
    environment:
      APP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
